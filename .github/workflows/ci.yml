name: Java CI/CD with Testcontainers and LocalStack

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Java 21 environment with Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Make sure the Docker service is ready (Testcontainers requires it)
      - name: Verify Docker Environment
        run: |
          docker info
          docker compose version

      # 4. Build the project and run the integration tests
      # Testcontainers automatically pulls the LocalStack image inside the GitHub Actions environment
      - name: Build and Run Integration Tests
        run: mvn clean verify

      # 5. Optional: upload test reports on failure (makes debugging easier)
      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
