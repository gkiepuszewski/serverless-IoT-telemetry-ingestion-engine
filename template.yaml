AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless IoT Telemetry Ingestion Engine - a real "serverless" deployment:
  an AWS Lambda subscribed to SQS via an Event Source Mapping, writing data
  to DynamoDB (single-table design). Built and tested as a PoC.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Environment name (used in resource names to avoid collisions).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java21
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"

Resources:
  # --- Input queue for telemetry published by IoT devices ---
  TelemetryIngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "telemetry-ingestion-queue-${Stage}"
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TelemetryIngestionDLQ.Arn
        maxReceiveCount: 5

  # --- Dead-letter queue: messages that failed processing 5 times ---
  TelemetryIngestionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "telemetry-ingestion-queue-${Stage}-dlq"
      MessageRetentionPeriod: 1209600 # 14 days

  # --- DynamoDB table (single-table design: PK/SK), shared with the "consumer" mode ---
  FleetManagementTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "FleetManagement-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # --- Lambda function: the actual "serverless" deployment ---
  TelemetryIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "telemetry-ingestion-${Stage}"
      Handler: com.gk3.demo.serverless.telemetry.engine.lambda.TelemetryIngestionLambdaHandler::handleRequest
      # Uber-jar generated by maven-shade-plugin (classifier "aws"), NOT the default
      # jar repackaged by spring-boot-maven-plugin (nested-jar layout incompatible
      # with running on the bare java21 Lambda runtime).
      CodeUri: target/serverless-IoT-telemetry-ingestion-engine-1.0.0-aws.jar
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: !Ref Stage
          APP_DYNAMODB_TABLE_NAME: !Ref FleetManagementTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FleetManagementTable
        - SQSPollerPolicy:
            QueueName: !GetAtt TelemetryIngestionQueue.QueueName
      Events:
        TelemetryQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TelemetryIngestionQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  TelemetryIngestionQueueUrl:
    Description: URL of the SQS queue accepting telemetry from IoT devices.
    Value: !Ref TelemetryIngestionQueue
  FleetManagementTableName:
    Description: Name of the DynamoDB table (single-table design).
    Value: !Ref FleetManagementTable
  TelemetryIngestionFunctionArn:
    Description: ARN of the Lambda function processing telemetry.
    Value: !GetAtt TelemetryIngestionFunction.Arn
